name: Build SHIFTWORLD Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.3 and Android templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz 'templates/*' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Configure Android SDK without deprecated tools package
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -noprompt
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Create Android export preset
        shell: bash
        run: |
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SHIFTWORLD-DEV.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.shiftworld.racing3d"
          package/name="SHIFTWORLD 3D"
          package/signed=true
          PRESET

      - name: Import game and configure Godot Android SDK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import
          cat > /tmp/configure_godot.gd <<'SCRIPT'
          extends EditorScript
          func _run() -> void:
              var settings = get_editor_interface().get_editor_settings()
              settings.set_setting("export/android/android_sdk_path", OS.get_environment("ANDROID_HOME"))
              settings.set_setting("export/android/debug_keystore", OS.get_environment("HOME") + "/.android/debug.keystore")
              settings.set_setting("export/android/debug_keystore_user", "androiddebugkey")
              settings.set_setting("export/android/debug_keystore_pass", "android")
              settings.save()
          SCRIPT
          godot --headless --editor --path . --script /tmp/configure_godot.gd

      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SHIFTWORLD-DEV.apk
          test -s build/SHIFTWORLD-DEV.apk
          ls -lh build/SHIFTWORLD-DEV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIFTWORLD-DEV
          path: build/SHIFTWORLD-DEV.apk
          if-no-files-found: error
