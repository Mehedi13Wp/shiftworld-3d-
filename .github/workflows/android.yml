name: Build SHIFTWORLD Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

      - name: Download Android export templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q Godot_v4.3-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create Android export preset
        run: |
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/SHIFTWORLD-DEV.apk"

          [preset.0.options]

          gradle_build/use_gradle_build=false
          package/unique_name="com.shiftworld.racing3d"
          package/name="SHIFTWORLD 3D"
          package/signed=true
          PRESET

      - name: Import project
        run: godot --headless --editor --path . --import

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SHIFTWORLD-DEV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHIFTWORLD-DEV
          path: build/SHIFTWORLD-DEV.apk
